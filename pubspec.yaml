name: ai_speaking_flutter_app
description: INNOTRIK speaking assistant for Android and installable web.
publish_to: none
version: 1.0.3+5

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  record: ^7.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/listening_lessons.json
    - assets/audio/A-3-5/GUIDE_RECORD/
    - assets/audio/A-3-5/GUIDE_PRAISE/
    - assets/audio/A-3-5/GUIDE_NEXT/
    - assets/audio/A-3-5/GUIDE_IDLE1/
    - assets/audio/A-3-5/GUIDE_IDLE2/
    - assets/audio/A-3-5/GUIDE_SKIP/
    - assets/audio/A-3-5/GUIDE_ENDING/
    - assets/audio/A-6-7/GUIDE_RECORD/
    - assets/audio/A-6-7/GUIDE_PRAISE/
    - assets/audio/A-6-7/GUIDE_NEXT/
    - assets/audio/A-6-7/GUIDE_IDLE1/
    - assets/audio/A-6-7/GUIDE_IDLE2/
    - assets/audio/A-6-7/GUIDE_SKIP/
    - assets/audio/A-6-7/GUIDE_ENDING/
    - assets/audio/A-6-7/SONGS/
    - assets/audio/A-6-7/SONG_INTRO/
    - assets/audio/A-8-10/GUIDE_RECORD/
    - assets/audio/A-8-10/GUIDE_PRAISE/
    - assets/audio/A-8-10/GUIDE_NEXT/
    - assets/audio/A-8-10/GUIDE_IDLE1/
    - assets/audio/A-8-10/GUIDE_IDLE2/
    - assets/audio/A-8-10/GUIDE_SKIP/
    - assets/audio/A-8-10/GUIDE_ENDING/
    - assets/audio/A-8-10/SONGS/
    - assets/audio/A-8-10/SONG_INTRO/
    - assets/audio/A-11-12/GUIDE_RECORD/
    - assets/audio/A-11-12/GUIDE_PRAISE/
    - assets/audio/A-11-12/GUIDE_NEXT/
    - assets/audio/A-11-12/GUIDE_IDLE1/
    - assets/audio/A-11-12/GUIDE_IDLE2/
    - assets/audio/A-11-12/GUIDE_SKIP/
    - assets/audio/A-11-12/GUIDE_ENDING/
    - assets/audio/A-13-15/GUIDE_RECORD/
    - assets/audio/A-13-15/GUIDE_PRAISE/
    - assets/audio/A-13-15/GUIDE_NEXT/
    - assets/audio/A-13-15/GUIDE_IDLE1/
    - assets/audio/A-13-15/GUIDE_IDLE2/
    - assets/audio/A-13-15/GUIDE_SKIP/
    - assets/audio/A-13-15/GUIDE_ENDING/
    - assets/images/lesson-intro-stage.webp
    - assets/images/song-karaoke-sunrise.webp
    - assets/images/mascot-robot.png
    - assets/images/mascot-robot-pointing.png
    - assets/images/topics/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
        
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F8F7FF"
    theme_color: "#3F51D9"
