<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Trợ lý giao tiếp và luyện nghe tiếng Anh HOMI.">
  <meta name="theme-color" content="#EAF4FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HOMI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>HOMI - Trợ lý giao tiếp</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { color-scheme: light; background: #eaf4ff; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eaf4ff;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script>
    let activePromptAudio = null;
    let finishActivePrompt = null;
    window.innotrikVoicePromptStop = function () {
      if (finishActivePrompt) finishActivePrompt('cancelled');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    };
    window.innotrikVoicePromptSpeakAndWait = function (text, locale, audioUrl) {
      window.innotrikVoicePromptStop();
      return new Promise(function (resolve) {
        if (!text) {
          resolve('skipped');
          return;
        }
        let finished = false;
        let loadTimeout;
        const clearAudio = function () {
          window.clearTimeout(loadTimeout);
          if (!activePromptAudio) return;
          activePromptAudio.onended = null;
          activePromptAudio.onerror = null;
          activePromptAudio.onplaying = null;
          activePromptAudio.pause();
          activePromptAudio.removeAttribute('src');
          activePromptAudio.load();
          activePromptAudio = null;
        };
        const finish = function (status) {
          if (finished) return;
          finished = true;
          window.clearTimeout(safetyTimeout);
          clearAudio();
          if (finishActivePrompt === finish) finishActivePrompt = null;
          resolve(typeof status === 'string' ? status : 'completed');
        };
        const safetyTimeout = window.setTimeout(
          () => {
            finish('timeout');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          },
          Math.min(44000, 10000 + Math.max(4000, 1500 + (String(text).length * 180))),
        );
        finishActivePrompt = finish;
        let usingDeviceVoice = false;
        const deviceVoice = function () {
          if (finished || usingDeviceVoice) return;
          usingDeviceVoice = true;
          clearAudio();
          if (!('speechSynthesis' in window)) { finish('unavailable'); return; }
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = locale || 'vi-VN';
          utterance.rate = 0.92;
          utterance.pitch = 1.05;
          utterance.volume = 1.0;
          utterance.onend = finish;
          utterance.onerror = finish;
          window.speechSynthesis.speak(utterance);
        };
        if (audioUrl) {
          const audio = new Audio(audioUrl);
          activePromptAudio = audio;
          audio.onended = finish;
          audio.onerror = deviceVoice;
          audio.onplaying = () => window.clearTimeout(loadTimeout);
          loadTimeout = window.setTimeout(deviceVoice, 8000);
          audio.play().catch(deviceVoice);
        } else {
          deviceVoice();
        }
      });
    };
    window.innotrikVoicePromptSpeak = function (text, locale, audioUrl) {
      window.innotrikVoicePromptSpeakAndWait(text, locale, audioUrl);
    };
    window.innotrikSpeechReadyCue = function () {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      window.innotrikReadyCueContext =
        window.innotrikReadyCueContext || new AudioContextClass();
      const context = window.innotrikReadyCueContext;
      if (context.state === 'suspended') context.resume();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(880, context.currentTime);
      gain.gain.setValueAtTime(0.0001, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, context.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.16);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(context.currentTime);
      oscillator.stop(context.currentTime + 0.17);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
