<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Trợ lý giao tiếp và luyện nghe tiếng Anh HOMI.">
  <meta name="theme-color" content="#EAF4FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HOMI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>HOMI - Trợ lý giao tiếp</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { color-scheme: light; background: #eaf4ff; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eaf4ff;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script>
    window.innotrikVoicePromptSpeak = function (text, locale) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = locale || 'vi-VN';
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      utterance.volume = 1.0;
      window.speechSynthesis.speak(utterance);
    };
    window.innotrikVoicePromptSpeakAndWait = function (text, locale) {
      return new Promise(function (resolve) {
        if (!('speechSynthesis' in window) || !text) {
          resolve('skipped');
          return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = locale || 'vi-VN';
        utterance.rate = 0.92;
        utterance.pitch = 1.05;
        utterance.volume = 1.0;

        let finished = false;
        const finish = function () {
          if (finished) return;
          finished = true;
          window.clearTimeout(safetyTimeout);
          resolve('completed');
        };
        utterance.onend = finish;
        utterance.onerror = finish;
        const safetyTimeout = window.setTimeout(
          finish,
          Math.max(4000, 1500 + (String(text).length * 180)),
        );
        window.speechSynthesis.speak(utterance);
      });
    };
    window.innotrikVoicePromptStop = function () {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    };
    window.innotrikSpeechReadyCue = function () {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      window.innotrikReadyCueContext =
        window.innotrikReadyCueContext || new AudioContextClass();
      const context = window.innotrikReadyCueContext;
      if (context.state === 'suspended') context.resume();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(880, context.currentTime);
      gain.gain.setValueAtTime(0.0001, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, context.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.16);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(context.currentTime);
      oscillator.stop(context.currentTime + 0.17);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
