<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Trợ lý giao tiếp và luyện nghe tiếng Anh INNOTRIK.">
  <meta name="theme-color" content="#EAF4FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="INNOTRIK">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>INNOTRIK - Trợ lý giao tiếp</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { color-scheme: light; background: #eaf4ff; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eaf4ff;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script>
    window.innotrikVoicePromptSpeak = function (text, locale) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = locale || 'vi-VN';
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    };
    window.innotrikVoicePromptStop = function () {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
